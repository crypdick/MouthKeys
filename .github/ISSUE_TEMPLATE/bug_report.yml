name: Bug Report
description: Report a reproducible MouthKeys bug.
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Briefly describe what is broken.
      placeholder: MouthKeys crashes when...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide exact steps a maintainer can follow.
      placeholder: |
        1. Open MouthKeys
        2. Configure...
        3. Press...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Commit you built from
      description: "`git rev-parse --short HEAD` in your clone."
      placeholder: "abc1234"
    validations:
      required: true
  - type: input
    id: speech-model
    attributes:
      label: Speech model
      placeholder: "base.en, CPU, compute_type=default"
    validations:
      required: false
  - type: input
    id: target-app
    attributes:
      label: App you were dictating into
      description: Delivery bugs often depend on the target app.
      placeholder: "Ghostty, VS Code, Firefox..."
    validations:
      required: false
  - type: input
    id: linux-version
    attributes:
      label: Linux distribution and desktop
      placeholder: "Fedora 43, KDE Wayland"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x86_64
        - aarch64
        - Unknown
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Share mouthkeys doctor/status output and relevant daemon.log errors from $XDG_STATE_HOME/mouthkeys (normally ~/.local/state/mouthkeys). Remove private details.
      render: text
    validations:
      required: false
  - type: textarea
    id: media
    attributes:
      label: Screenshots or screen recording
      description: Attach screenshots or a recording if they help explain the bug.
    validations:
      required: false
